# Local smoke test for ppo_gru_g2_actorcritic_cluster.yaml before launching on the
# cluster: same network (GRU on both actor and critic), scaled down to fit an 8GB GPU.
# Verifies the critic-GRU wiring (rl_training/rl_games/networks/ann/gru_actor_critic.py)
# actually trains -- seq_length printed, no minibatch/seq_length assertion, mb_rnn_states
# is a 2-element list -- before spending cluster budget on it.
params:
  seed: 42
  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  load_checkpoint: False

  network:
    name: mlp_gru_actor_critic
    separate: True
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    actor:
      hidden_dims: [256, 256, 64]
      activation: elu
      gru:
        hidden_size: 64
        num_layers: 1
    critic:
      hidden_dims: [256, 256, 64]
      activation: elu
      gru:
        hidden_size: 64
        num_layers: 1

  config:
    name: f450_navigation
    env_name: f450_navigation_task
    env_config:
      headless: True
      use_warp: True

    # Reward scaling
    reward_shaper:
      scale_value: 1.0

    # PPO settings
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    ppo: True

    # Learning rate
    learning_rate: 1e-4
    lr_schedule: adaptive
    kl_threshold: 0.008

    # Training params
    save_best_after: 10
    save_frequency: 50
    score_to_win: 100000
    grad_norm: 1.0
    entropy_coef: 0.001
    truncate_grads: True
    e_clip: 0.2
    clip_value: False

    # Batch settings: scaled down for local/8GB use (matches ppo_gru_local.yaml sizing).
    # 64 * 64 = 4096, 16 minibatches of 256; 256 % 8 == 0 and 64 % 8 == 0.
    num_actors: 64
    horizon_length: 64
    minibatch_size: 256
    mini_epochs: 4
    seq_length: 8

    # Value function
    critic_coef: 2
    normalize_value: True
    value_bootstrap: True

    # Input normalization (important for mixed state + VAE latents)
    normalize_input: True

    # Other settings
    bounds_loss_coef: 0.01
    max_epochs: 50
    use_diagnostics: True

    # Player settings (for inference/testing)
    player:
      render: True
      deterministic: True
      games_num: 100000
      num_actors: 1
