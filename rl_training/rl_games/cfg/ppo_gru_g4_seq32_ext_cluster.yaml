# G-series: GRU memory experiments (session "GRU-A2C"), testing whether recurrence
# raises success rate now that the B-series (command smoothness/saturation) and the
# p_blind reward change (see ppo_mlp_p_blind_cluster.yaml) are exhausted.
#
# G4: GRU on both actor and critic, same as G2 (ppo_gru_g2_actorcritic_cluster.yaml)
# except seq_length: 32 steps = 32 * (sim dt 0.01 * 3 substeps) = 0.96s of BPTT --
# the upper end of a reasonable memory horizon for a 128-step (3.84s) rollout, since
# it still divides horizon_length into 4 stored-state chunks.
#
# Identical to ppo_mlp_p_blind_cluster.yaml except the network block and this comment.
params:
  seed: 42
  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  load_checkpoint: False

  network:
    name: mlp_gru_actor_critic
    separate: True
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    actor:
      hidden_dims: [256, 256, 64]
      activation: elu
      gru:
        hidden_size: 64
        num_layers: 1
    critic:
      hidden_dims: [256, 256, 64]
      activation: elu
      gru:
        hidden_size: 64
        num_layers: 1

  config:
    name: f450_navigation
    env_name: f450_navigation_task
    env_config:
      headless: True
      use_warp: True

    # Reward scaling
    reward_shaper:
      scale_value: 1.0

    # PPO settings
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    ppo: True

    # Learning rate: unchanged from the p_blind baseline.
    learning_rate: 1e-4          # starting point; the scheduler moves it from here
    lr_schedule: adaptive
    kl_threshold: 0.008

    # Training params
    save_best_after: 10
    save_frequency: 50
    score_to_win: 100000
    grad_norm: 1.0
    entropy_coef: 0.001
    truncate_grads: True
    e_clip: 0.2
    clip_value: False

    # Batch settings: unchanged from the p_blind baseline. horizon_length (128) and
    # minibatch_size (8192) must both stay divisible by seq_length (rl_games asserts
    # minibatch_size % seq_length == 0; horizon_length % seq_length == 0 is required too,
    # since a2c_common floors num_seqs = horizon_length // seq_length silently otherwise).
    num_actors: 1024
    horizon_length: 128
    minibatch_size: 8192
    mini_epochs: 4
    seq_length: 32

    # Value function
    critic_coef: 2
    normalize_value: True
    value_bootstrap: True

    # Input normalization (important for mixed state + VAE latents)
    normalize_input: True

    # Other settings
    bounds_loss_coef: 0.01
    # B-test budget: capped at 2000, same as the p_blind baseline, so recurrence is
    # evaluated on its own before committing the larger production budget.
    max_epochs: 3000
    use_diagnostics: True

    # Player settings (for inference/testing)
    player:
      render: True
      deterministic: True
      games_num: 100000
      num_actors: 1
