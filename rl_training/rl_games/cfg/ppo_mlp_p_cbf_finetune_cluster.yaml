# p_cbf FINE-TUNE arm: resume the p_fov run's final checkpoint and add the discrete-time
# control barrier function on obstacle clearance for 1000 more epochs.
#
# BASE: runs/f450_nav_p_fov/2026-09-16_19-45-47, epoch 2000, curriculum level 30,
# success 86.8%, crash 13.0%, return 11.05. Trained from scratch with
# F450_LAMBDA_FOV=0.015 and p_blind off. Its measured per-step reward split:
#   r_progress +0.0255 | p_fov -0.0126 | p_action_mag -0.0110 | p_jerk -0.0026
#   p_speed    -0.0003 | p_blind 0.0
# (p_fov at -0.0126/step against b4's predicted -0.029 is itself the p_fov result: the
# policy learned to aim, so the term it is charged for shrank.)
#
# max_epochs is 3000, not 1000: rl_games resumes the epoch COUNTER from the checkpoint and
# the base ended at 2000, so 3000 is what yields 1000 additional epochs. Same convention
# as the p_fov and impact-speed fine-tunes. Every other hyperparameter is inherited from
# the p_fov fine-tune config unchanged, so nothing jumps under the resumed weights except
# the reward.
#
# p_fov STAYS ON at its trained weight, deliberately. This arm measures "p_fov + p_cbf"
# against "p_fov alone", not p_cbf in isolation: the two price different things -- where
# the velocity points, versus how much room is left in front of it -- and switching p_fov
# off would change two things at once under weights that were shaped by it.
#
# MUST be submitted with CURRICULUM_LEVEL=30. Without it the sbatch leaves the curriculum
# free, which starts at min_level 0, so a fine-tune of a policy that already reached level
# 30 would spend its whole budget re-climbing ground it has covered, and would never be
# measured at the density the comparison is about. (The p_fov fine-tune arm was launched
# without it once, job 271581, and had to be cancelled 31 minutes in.)
#
# --- BLOCKING PREREQUISITES. Do not submit before both are done. ---------------------
#
#   1. DONE -- python analysis/validate_ray_probe.py --phase exact, then --phase field
#      d_obstacle comes from RaySphereProbe (16,384 ray casts over a sphere), NOT from the
#      exact closest-point query: that query faults with CUDA error 700 on these
#      73k-triangle meshes at every curriculum level above 0 and at every search radius,
#      under Warp 1.0.0. Ray queries over the same meshes are fine, which is why the depth
#      camera works. Validation, measured: error +0.0001 m against the exact query at
#      level 0 (the one level it survives), never negative; no faults over 100 steps x 128
#      envs at level 30; 19.3 ms/step at 128 envs.
#
#      KNOWN BIAS, and it is signed the unsafe way: 27% of samples read more than 0.10 m
#      ABOVE the depth image's minimum (p99 +0.56 m), because the image is ~33x denser per
#      steradian inside its cone than a 16,384-ray sphere is anywhere. Clearance therefore
#      reads optimistic by order 0.1-0.3 m near thin geometry, which permits slightly more
#      closing speed than it should. Tolerable for a shaping term on top of an already
#      conservative alpha; NOT tolerable if p_cbf is ever promoted to a hard filter.
#
#   2. DONE -- analysis/measure_cbf_margin.py on this very checkpoint, 1500 steps x 256
#      envs, 381,798 paired steps (analysis/data/cbf_margin_p_fov_l30.json). At the shipped
#      d_safe = 1.0 / alpha = 0.5 the mean excess closing speed is 0.372 m/s, so the
#      0.0255/step target (r_progress on this baseline) gives
#          F450_LAMBDA_CBF = 0.0255 / 0.372 = 0.0686
#      the same sizing rule lambda_fov was set by. Superseded lines follow, kept as the
#      command that produced it:
#      python analysis/measure_cbf_margin.py \
#        runs/f450_nav_p_fov/2026-09-16_19-45-47/nn/last_f450_nav_p_fov_ep_2000_rew_11.048738.pth \
#        30 analysis/data/cbf_margin_p_fov_l30.json
#
#      EXPECT A 51% VIOLATION RATE from step one: at alpha = 0.5 the barrier is violated on
#      just over half of all steps. Tight, as chosen, but not degenerate -- the other 49%
#      are compliant, so the gradient still has structure. The measured full-sphere
#      clearance distribution is p25 0.85 / p50 1.10 / p75 1.40 m, so d_safe = 1.0 sits just
#      under the MEDIAN and h < 0 on roughly 40% of steps. If that proves too hot,
#      F450_D_SAFE=0.7 (13% of steps inside, 41.6% violation) and a larger F450_ALPHA_CBF
#      are each one env var away. Watch metrics/cbf_violation_rate.
#
# Submit (lambda_cbf from step 2; p_fov held at the base run's weight, p_blind off):
#   sbatch --export=ALL,CONFIG_FILE=rl_training/rl_games/cfg/ppo_mlp_p_cbf_finetune_cluster.yaml \
#     ,CHECKPOINT=runs/f450_nav_p_fov/2026-09-16_19-45-47/nn/last_f450_nav_p_fov_ep_2000_rew_11.048738.pth \
#     ,EXPERIMENT=f450_nav_p_cbf_ft,CURRICULUM_LEVEL=30 \
#     ,F450_LAMBDA_FOV=0.015,F450_LAMBDA_BLIND=0.0 \
#     ,F450_LAMBDA_CBF=0.0686,F450_D_SAFE=1.0,F450_ALPHA_CBF=0.5 \
#     slurm/train_navigation.sbatch
#
# COST. The clearance probe casts 16,384 rays per env per step, measured at 19.3 ms/step at
# 128 envs, so roughly 154 ms/step at this config's 1024 actors -- about +20 s on a ~56 s
# epoch, i.e. expect ~21 h for the 1000 epochs rather than ~16 h. F450_CBF_RAYS trades that
# back linearly, against the thin-geometry detection limit (see the task config).
#
# --- WHAT TO WATCH ---------------------------------------------------------------------
# metrics/cbf_violation_rate FIRST. alpha = 0.5 /s permits only alpha*h of closing speed:
# 0.25 m/s at 1.5 m of clearance, against a measured 2.6 m/s cruise. It is expected to
# bind hard and may sit near 1.0 -- at which point every step is a violation, p_cbf has
# degenerated into a flat speed tax with no gradient structure left, and alpha should be
# raised. That is a deliberate starting point ("tight first, loosen later"), not a sized
# value; sizing alpha ~ v_cruise / h_typical would give 2-6 /s instead. Sweep with
# F450_ALPHA_CBF, no file edit needed.
#
# metrics/d_obstacle says whether the policy is buying clearance or merely slowing down.
# Watch the mean altitude too: the floor is in the probe's mesh and top_wall is off, so
# climbing buys clearance for free and pinning to the upper bound would be the term being
# gamed rather than obeyed.
#
params:
  seed: 42
  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  load_checkpoint: False

  network:
    name: mlp_actor_critic
    separate: True
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    actor:
      hidden_dims: [256, 256, 64]
      activation: elu
    critic: 
      hidden_dims: [256, 256, 64]
      activation: elu

  config:
    name: f450_navigation
    env_name: f450_navigation_task
    env_config:
      headless: True
      use_warp: True

    # Reward scaling
    reward_shaper:
      scale_value: 1.0

    # PPO settings
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    ppo: True

    # Learning rate
    #
    # Adaptive, not constant: a fixed LR left learning speed on the table.
    #
    # AdaptiveScheduler halves/grows the LR to hold KL near kl_threshold: below
    # 0.5*threshold it multiplies by 1.5, above 2*threshold it divides by 1.5, and leaves
    # it alone in between.
    # NOTE: rl-games 1.6.1 hardcodes min_lr=1e-6 / max_lr=1e-2 inside AdaptiveScheduler
    # and reads ONLY kl_threshold from this config, so listing min_lr/max_lr here would
    # be inert -- do not add them expecting them to bind.
    learning_rate: 1e-4          # starting point; the scheduler moves it from here
    lr_schedule: adaptive
    # 0.016. Raising this to 0.03 (run 261653) was a mistake and is reverted here.
    # The reasoning was that measured KL (~0.025) sat at the top of the no-change band
    # [0.5x, 2x] = [0.008, 0.032], so the scheduler kept cutting lr. Widening the band to
    # [0.015, 0.060] did stop the thrash -- and made everything else worse. Over 219
    # epochs at a CONSTANT curriculum level 14: success 0.706 -> 0.633, crash 0.278 ->
    # 0.342, exp_var 0.617 -> 0.557, with lr running up to 8.8e-4 and clip_frac ~0.42.
    #
    # Mechanism: with fixed_sigma, widening sigma reduces how much logp moves when mu
    # moves, so a policy taking large steps is REWARDED by the surrogate for inflating
    # sigma to keep the PPO ratio inside the clip range. Entropy duly accelerated from
    # +0.0024/epoch (original run) to +0.0045 and then +0.0081, reaching sigma ~1.28 --
    # wider than an untrained policy. Large updates were feeding the entropy problem.
    # 0.008, halved from 0.016. Measured on run of4veb49 (2026-08-30_11-18-55): epoch-mean
    # KL sat at a MEDIAN of 0.0225 -- inside the no-change band [0.5x, 2x] = [0.008, 0.032]
    # but in its upper half -- and exceeded the band on 8.3% of iterations, against 2.0% in
    # breezy-thunder-6, the run that behaved. So the policy was persistently taking large
    # steps that the scheduler tolerated.
    #
    # That matters because of the mechanism documented under entropy_coef below: with
    # fixed_sigma, a policy taking large mu steps is REWARDED by the clipped surrogate for
    # inflating sigma, since a wider sigma shrinks how much logp moves for a given mu move
    # and keeps the PPO ratio inside e_clip. Sigma inflation is trust-region evasion, not
    # exploration. Tightening the trust region removes the payoff.
    #
    # Note this is the OPPOSITE direction to run 261653, which raised it to 0.03 and made
    # everything worse -- that run is the evidence this lever is real and signed.
    kl_threshold: 0.008

    # Training params
    save_best_after: 10
    save_frequency: 50
    score_to_win: 100000
    grad_norm: 1.0
    # 0.001. Lowering this to 0.0002 (run 261653) was tested and FALSIFIED: with one fifth
    # the entropy bonus, entropy rose ~2-3x FASTER (+0.0081/epoch vs +0.0024). The bonus is
    # a constant push of magnitude entropy_coef on log_std and was never the dominant term;
    # the clipped surrogate is. Reverted, since the change removed exploration for no
    # demonstrated benefit. If entropy still climbs at kl_threshold 0.016, the direct lever
    # is a NEGATIVE entropy_coef -- the loss term is `- entropy * entropy_coef`, so a
    # negative value penalises entropy and shrinks sigma outright.
    entropy_coef: 0.001
    truncate_grads: True
    e_clip: 0.2
    clip_value: False

    # Batch settings
    #
    # horizon_length 128, up from 64, and minibatch_size 8192, up from 4096. THE TWO MUST
    # MOVE TOGETHER -- see below.
    #
    # WHY 128. The rollout has to be long enough to contain a complete episode, or the
    # terminal reward reaches the policy only through the bootstrapped value function
    # (whose explained variance is 0.68, not 0.95). Measured on run of4veb49: mean episode
    # 81 steps, p99 91, worst 103, and episode length grows only +0.43 steps per curriculum
    # level (extrapolating to 85 at level 30). At horizon_length 64, ZERO of 2349
    # iterations had a mean episode shorter than the rollout. breezy-thunder-6, the run that
    # behaved, had a rollout/episode ratio of 1.60; this run had 0.79.
    #
    # WHY NOT MORE. Every horizon worth covering lands at ~100 steps: the GAE blend
    # 1/(1-tau) = 20 with weights decayed to 0.006 by step 100, the discount 1/(1-gamma) =
    # 100, and the p99 episode at 91. Past 128 the extra steps are already discounted away
    # and GAE resets at episode boundaries anyway, so it buys nothing but a bigger batch --
    # and batch size is not the constraint here with 1024 envs.
    #
    # WHY minibatch_size HAD TO FOLLOW. Gradient steps per update are
    # (horizon_length * num_actors / minibatch_size) * mini_epochs. Raising the horizon
    # alone would have taken that from 64 to 128 -- twice as many gradient steps on one
    # batch of data, so the policy drifts further from the behaviour policy within a single
    # update, KL rises, clipping rises. That is exactly the pressure that inflates sigma, so
    # it would have fed the failure this change exists to fix. 8192 holds it at 64.
    num_actors: 1024
    horizon_length: 128
    minibatch_size: 8192
    mini_epochs: 4
    seq_length: 8

    # Value function
    critic_coef: 2
    normalize_value: True
    value_bootstrap: True

    # Input normalization (important for mixed state + VAE latents)
    normalize_input: True

    # Other settings
    # 0.001, raised 10x from 0.0001. This is the ONLY term in the loss that acts on mu
    # directly, and on run of4veb49 it lost: bounds_loss climbed 2.8 -> 42.4 over 2349
    # iterations while contributing at most 4.2e-3 to the total loss, and mean |mu| reached
    # 3.97 against an action box of +/-1. 95% of the deployed policy's outputs were clamped,
    # and a 0.1-sigma change in any input moved the resulting command by 0.0000 -- a relay,
    # not a controller.
    #
    # The clamp is what makes this self-reinforcing: past |mu| = 1 the environment executes
    # an identical action for mu = 1.1 and mu = 14, so nothing on the reward side
    # distinguishes them and mu is free to run. bounds_loss is the only thing that objects.
    #
    # For scale, breezy-thunder-6 finished with bounds_loss 0.18 and mean |mu| 0.84 -- a
    # 180x difference in the same quantity, same coefficient. The coefficient was never
    # wrong on its own; it became too weak when the task changed underneath it.
    #
    # PROMOTED TO DEFAULT from the smoothness/saturation B-series: 0.01 (10x) was B1's
    # isolated test and held up combined with the magnitude penalty in B4 -- 8.3x lower
    # bounds_loss than 0.001 at matched curriculum levels, flat instead of growing, and
    # curriculum progression ~13% FASTER, not slower. See rl_training/README or the B1/B4
    # PR (f450-smoothness-saturation-experiments) for the full comparison data. Known
    # tradeoff: jerk was mildly worse in B1 alone (removing the clamp removed some
    # incidental smoothing) -- resolved by pairing with lambda_action_mag below.
    bounds_loss_coef: 0.01
    # 5000, up from 1000. The previous run was still gaining curriculum levels when it hit
    # the 1000-epoch ceiling (reached level 14 at epoch 984), so it stopped for want of
    # budget rather than progress. At ~31 s/epoch, 5000 epochs is ~43 h.
    max_epochs: 3000
    use_diagnostics: True

    # Player settings (for inference/testing)
    player:
      render: True
      deterministic: True
      games_num: 100000
      num_actors: 1
